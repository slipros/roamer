on:
  push:
    branches:
      - main
  pull_request:

name: run tests
permissions:
  contents: read
  statuses: write
  security-events: write
jobs:
  test:
    strategy:
      matrix:
        include:
          # govulncheck is pinned per Go version: v1.1.x is the last line that
          # builds on go 1.22, while newer Go can use the latest release.
          - go-version: "1.22"
            govulncheck-version: v1.1.4
          - go-version: "1.25"
            govulncheck-version: latest
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - name: Install Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run govulncheck
        # Installed and run directly instead of golang/govulncheck-action, whose
        # bundled actions/checkout@v4.1.1 fails on current runners with
        # `Duplicate header: "Authorization"`. Runs on every matrix Go version so
        # version-specific stdlib vulnerabilities are caught for each; the
        # govulncheck release is matched to the Go version (see matrix include).
        # The repo and Go are already set up by the steps above.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ matrix.govulncheck-version }}
          govulncheck ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Skip `config verify`, which fetches the JSON schema over the network
          # and flakes out on runners when golangci-lint.run is unreachable.
          verify: false

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v '/mockroamer')

      - name: Convert coverage.out to coverage.lcov
        uses: jandelgado/gcov2lcov-action@v1

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov